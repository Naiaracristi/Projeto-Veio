<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Orçamento</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Nei Orçamentos</h1>

    <p class="aviso">
      <strong>Atenção:</strong>
      Esses Valores podem ser alterados a qualquer momento, mediante a pedido.
    </p>

    <form id="formServico">
      <label for="nomeCliente">Cliente</label>
      <input type="text" id="nomeCliente" required />

      <label for="descricaoServico">Serviço</label>
      <input type="text" id="descricaoServico" required />

      <label for="dataOrcamento">Data</label>
      <input type="date" id="dataOrcamento" required />

      <label for="metragem">Metragem (m²)</label>
      <input type="number" id="metragem" step="0.01" min="0" required />

      <label for="valorM2">Valor por m² (R$)</label>
      <input type="number" id="valorM2" step="0.01" min="0" required />

      <h3>Materiais / serviços extras</h3>
      <div id="linhasExtras"></div>

      <button type="button" id="btnAddLinha" class="secundario">
        Serviços Extra
      </button>

      <button type="submit">Gerar orçamento</button>
    </form>

    <div id="resumoOrcamento"></div>

    <div id="resumoOrcamento" style="display: none">
      <!-- conteúdo gerado pelo JS -->
    </div>

    <button id="btnImprimir" style="display: none">Gerar PDF</button>

    <script src="./script.js"></script>
  </body>
</html>
